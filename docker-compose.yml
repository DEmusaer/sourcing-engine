services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./rate_library.csv:/app/rate_library.csv
      - rate_data:/data
    environment:
      - DATA_DIR=/data
      - STREAMLIT_SERVER_HEADLESS=true
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    volumes:
      - rate_data:/data
    environment:
      - DATA_DIR=/data
      - S3_BUCKET=${S3_BUCKET}
      - S3_PREFIX=${S3_PREFIX:-sourcing-engine-backups}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    restart: no
    profiles:
      - backup

volumes:
  rate_data:
